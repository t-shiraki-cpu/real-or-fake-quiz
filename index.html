<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>見破れ、みんなの真実</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfbfa; --surface:#ffffff; --surface-alt:#f1f1f4; --line: rgba(20,20,30,0.10);
    --accent:#4f46e5; --accent-ink:#ffffff; --correct:#16a34a; --incorrect:#dc2626;
    --text:#15161d; --muted:#6b7280; --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(79,70,229,0.05), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(22,163,74,0.04), transparent 40%),
      var(--bg);
    color:var(--text); font-family:"Noto Sans JP", sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .display{font-family:"Zen Kaku Gothic New", sans-serif; font-weight:900;}
  #app{ max-width:480px; margin:0 auto; min-height:100vh; padding:28px 20px 60px; position:relative; }
  .eyebrow{ display:inline-block; font-size:12.5px; color:var(--accent); background:rgba(79,70,229,0.10);
    border:1px solid rgba(79,70,229,0.30); padding:5px 12px; border-radius:100px; margin-bottom:14px; font-weight:700; letter-spacing:0.02em; }
  h1.title{ font-size:30px; line-height:1.35; margin:0 0 10px; }
  p.lede{ color:var(--muted); font-size:15px; line-height:1.75; margin:0 0 24px; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:16px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; width:100%; padding:15px 18px; border-radius:10px;
    border:none; font-family:"Noto Sans JP", sans-serif; font-weight:700; font-size:15.5px; cursor:pointer;
    transition:transform 0.12s ease, filter 0.12s ease; }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent; color:var(--text); border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--surface-alt);}
  input[type="text"]{ width:100%; background:var(--surface-alt); border:1px solid var(--line); color:var(--text);
    font-family:"Noto Sans JP", sans-serif; font-size:15px; padding:13px 14px; border-radius:10px; margin-bottom:14px; }
  input[type="text"]:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .progress-row{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
  .progress-track{flex:1; height:6px; background:var(--surface-alt); border-radius:100px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--accent); border-radius:100px; transition:width 0.35s ease;}
  .progress-label{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .duel{ position:relative; display:grid; grid-template-columns:1fr 1fr; gap:2px; background:var(--accent);
    border-radius:var(--radius); overflow:hidden; margin-bottom:18px; box-shadow:0 18px 40px -20px rgba(0,0,0,0.6); }
  .duel-side{ position:relative; background:var(--surface); aspect-ratio:3/4; cursor:pointer; overflow:hidden; }
  .duel-side img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform 0.25s ease, filter 0.25s ease; }
  .duel-side:active img{transform:scale(0.97);}
  .duel-vs{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:38px; height:38px; border-radius:50%;
    background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:13px; z-index:5; box-shadow:0 0 0 6px var(--bg); }
  .duel-label{ position:absolute; bottom:0; left:0; right:0; padding:8px 10px 7px; font-size:12px; font-weight:700;
    text-align:center; background:linear-gradient(to top, rgba(0,0,0,0.72), transparent); }
  .duel-side.correct::after, .duel-side.wrong::after{ content:""; position:absolute; inset:0; }
  .duel-side.correct::after{background:rgba(22,163,74,0.14); box-shadow:inset 0 0 0 3px var(--correct);}
  .duel-side.wrong::after{background:rgba(220,38,38,0.12); box-shadow:inset 0 0 0 3px var(--incorrect);}
  .duel-side.dim img{filter:grayscale(0.3) brightness(0.6);}
  .stamp{ position:absolute; top:38%; left:50%; transform:translate(-50%,-50%) rotate(-10deg) scale(0.6);
    font-family:"Zen Kaku Gothic New", sans-serif; font-weight:900; font-size:34px; padding:6px 22px;
    border:5px solid currentColor; border-radius:10px; letter-spacing:0.04em; z-index:10; opacity:0;
    animation: stampIn 0.38s cubic-bezier(.2,1.4,.4,1) forwards; pointer-events:none; }
  .stamp.correct{color:var(--correct);} .stamp.wrong{color:var(--incorrect);}
  @keyframes stampIn{
    0%{opacity:0; transform:translate(-50%,-50%) rotate(-10deg) scale(0.6);}
    60%{opacity:1; transform:translate(-50%,-50%) rotate(-10deg) scale(1.12);}
    100%{opacity:1; transform:translate(-50%,-50%) rotate(-10deg) scale(1);}
  }
  .hint{font-size:13px; color:var(--muted); text-align:center; margin:2px 0 20px;}
  .score-hero{ text-align:center; padding:36px 20px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); margin-bottom:16px; }
  .score-num{font-size:64px; line-height:1; margin:6px 0 2px;}
  .score-den{color:var(--muted); font-size:16px;}
  .score-tier{ display:inline-block; margin-top:14px; background:rgba(79,70,229,0.12); color:var(--accent);
    border:1px solid rgba(79,70,229,0.30); padding:6px 16px; border-radius:100px; font-weight:700; font-size:13.5px; }
  table.board{width:100%; border-collapse:collapse; font-size:14px;}
  table.board th{text-align:left; color:var(--muted); font-weight:500; font-size:12px; padding:0 8px 8px; border-bottom:1px solid var(--line);}
  table.board td{padding:10px 8px; border-bottom:1px solid var(--line);}
  table.board tr.me{background:rgba(79,70,229,0.07);}
  table.board td.rank{color:var(--muted); width:28px;}
  table.board td.pct{text-align:right; font-variant-numeric:tabular-nums; color:var(--accent); font-weight:700;}
  .spinner{ width:22px; height:22px; border-radius:50%; border:3px solid var(--surface-alt); border-top-color:var(--accent);
    animation:spin 0.7s linear infinite; margin:0 auto; }
  @keyframes spin{to{transform:rotate(360deg);}}
  .center-note{text-align:center; color:var(--muted); font-size:13.5px; padding:24px 0;}
  .status-msg{font-size:13px; padding:10px 12px; border-radius:8px; margin-bottom:14px;}
  .status-msg.err{background:rgba(220,38,38,0.10); color:var(--incorrect);}
</style>
</head>

const SHEET_CSV_URL = "__SHEET_CSV_URL__"; // スプレッドシートの「ウェブに公開」CSVリンク
/* ================================ */

let state = {
  view: "intro", name: "", order: [], sides: [], qIndex: 0, answers: [],
  leaderboard: null, leaderboardLoading: false,
};

function render(){
  const app = document.getElementById("app");
  app.innerHTML = viewHTML();
  attachHandlers();
}

function viewHTML(){
  switch(state.view){
    case "intro": return introHTML();
    case "name": return nameHTML();
    case "quiz": return quizHTML();
    case "result": return resultHTML();
    default: return "";
  }
}

function introHTML(){
  const qCount = QUESTIONS.length;
  return `
    <span class="eyebrow">REAL or FAKE ゲーム</span>
    <h1 class="title display">見破れ、<br>${qCount}人の真実。</h1>
    <p class="lede">2枚並んだ写真のうち、本物はどちらか。${qCount}問連続でその目利き力を試す一発勝負のクイズです。</p>
    <div class="card">
      <div style="font-weight:700; font-size:13.5px; margin-bottom:2px;">遊び方</div>
      <p class="lede" style="margin-bottom:0;">・1問ごとに2枚の写真が出ます<br>・「本物」だと思う方をタップ<br>・${qCount}問終わったら正解率が出ます<br>・結果はみんなのランキングに記録されます</p>
    </div>
    ${qCount > 0
      ? `<button class="btn btn-primary" id="start-btn">はじめる</button>`
      : `<div class="status-msg err">問題画像が設定されていません。運営者にご確認ください。</div>`
    }
  `;
}

function nameHTML(){
  return `
    <span class="eyebrow">STEP 1 / 2</span>
    <h1 class="title display">お名前を<br>教えてください</h1>
    <p class="lede">ランキング表示に使われます。ニックネームでもOKです。</p>
    <input type="text" id="name-input" placeholder="例）タナカ" maxlength="20">
    <button class="btn btn-primary" id="name-next-btn">クイズを始める</button>
  `;
}

function quizHTML(){
  const q = state.qIndex;
  const qTotal = state.order.length;
  const person = state.order[q];
  const sides = state.sides[q];
  const leftSrc = QUESTIONS[person][sides.left];
  const rightSrc = QUESTIONS[person][sides.right];
  const answered = state.answers.length > q;
  const picked = answered ? state.answers[q].picked : null;

  const sideClass = (kind) => {
    if(!answered) return "";
    const isReal = kind === "real";
    if(picked === kind){ return isReal ? "correct" : "wrong"; }
    if(isReal){ return "dim correct"; }
    return "dim";
  };

  return `
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" style="width:${(q/qTotal)*100}%"></div></div>
      <div class="progress-label">${q+1} / ${qTotal}</div>
    </div>
    <h1 class="title display" style="font-size:21px; text-align:center;">どちらが本物？</h1>
    <div class="duel">
      <div class="duel-side ${sideClass('left')}" data-side="left" ${answered ? "" : 'data-clickable="1"'}>
        <img src="${leftSrc||''}" alt="">
        ${answered ? `<div class="duel-label">${sides.left==='real' ? '本物':'フェイク'}</div>` : ""}
        ${answered && picked==='left' ? `<div class="stamp ${sides.left==='real'?'correct':'wrong'}">${sides.left==='real'?'正解':'不正解'}</div>` : ""}
      </div>
      <div class="duel-vs">VS</div>
      <div class="duel-side ${sideClass('right')}" data-side="right" ${answered ? "" : 'data-clickable="1"'}>
        <img src="${rightSrc||''}" alt="">
        ${answered ? `<div class="duel-label">${sides.right==='real' ? '本物':'フェイク'}</div>` : ""}
        ${answered && picked==='right' ? `<div class="stamp ${sides.right==='real'?'correct':'wrong'}">${sides.right==='real'?'正解':'不正解'}</div>` : ""}
      </div>
    </div>
    ${answered
      ? `<button class="btn btn-primary" id="next-q-btn">${q+1 < qTotal ? "次の問題へ" : "結果を見る"}</button>`
      : `<p class="hint">写真をタップして選んでください</p>`
    }
  `;
}

function resultHTML(){
  const qTotal = state.order.length;
  const score = state.answers.filter(a=>a.correct).length;
  const pct = Math.round((score/qTotal)*100);
  let tier = "";
  if(pct === 100) tier = "完全看破・伝説の目利き";
  else if(pct >= 80) tier = "かなりの目利き";
  else if(pct >= 50) tier = "五分五分の勝負師";
  else tier = "AIに軍配";

  let boardHTML = "";
  if(!SHEET_CSV_URL){
    boardHTML = "";
  } else if(state.leaderboardLoading){
    boardHTML = `<div class="center-note"><div class="spinner"></div><div style="margin-top:10px;">ランキング集計中…</div></div>`;
  } else if(state.leaderboard){
    const rows = state.leaderboard.slice(0,10).map((e,idx)=>`
      <tr class="${e.name===state.name ? "me":""}">
        <td class="rank">${idx+1}</td>
        <td>${escapeHtml(e.name)}</td>
        <td class="pct">${Math.round((e.score/e.total)*100)}%</td>
      </tr>
    `).join("");
    boardHTML = `
      <div class="card">
        <div style="font-weight:700; font-size:13.5px; margin-bottom:10px;">みんなの正解率 TOP10</div>
        <table class="board"><thead><tr><th></th><th>名前</th><th style="text-align:right;">正解率</th></tr></thead><tbody>${rows}</tbody></table>
      </div>
    `;
  }

  return `
    <div class="score-hero">
      <div style="color:var(--muted); font-size:13.5px;">${escapeHtml(state.name)} さんの結果</div>
      <div class="score-num display">${score}<span style="font-size:28px;color:var(--muted);">/${qTotal}</span></div>
      <div class="score-den">正解率 ${pct}%</div>
      <div class="score-tier">${tier}</div>
    </div>
    ${boardHTML}
    <button class="btn btn-ghost" id="retry-btn">もう一度挑戦する</button>
  `;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function attachHandlers(){
  const $ = sel => document.querySelector(sel);
  if(state.view === "intro"){
    const b = $("#start-btn");
    if(b) b.onclick = () => { state.view = "name"; render(); };
  }
  if(state.view === "name"){
    $("#name-next-btn").onclick = () => {
      const val = $("#name-input").value.trim();
      if(!val){ $("#name-input").focus(); return; }
      state.name = val;
      beginQuiz();
    };
  }
  if(state.view === "quiz"){
    document.querySelectorAll('[data-clickable="1"]').forEach(el => {
      el.onclick = () => handleAnswer(el.getAttribute("data-side"));
    });
    const nextBtn = $("#next-q-btn");
    if(nextBtn) nextBtn.onclick = () => nextQuestion();
  }
  if(state.view === "result"){
    $("#retry-btn").onclick = () => {
      state.view = "name"; state.answers = []; state.qIndex = 0; state.leaderboard = null;
      render();
    };
    if(SHEET_CSV_URL && !state.leaderboard && !state.leaderboardLoading) loadLeaderboard();
  }
}

function beginQuiz(){
  const order = QUESTIONS.map((_,i)=>i);
  shuffle(order);
  const sides = order.map(() => Math.random() < 0.5 ? {left:"real", right:"fake"} : {left:"fake", right:"real"});
  state.order = order; state.sides = sides; state.qIndex = 0; state.answers = [];
  state.view = "quiz"; render();
}

function handleAnswer(side){
  const q = state.qIndex;
  if(state.answers.length > q) return;
  const kind = state.sides[q][side];
  state.answers[q] = { picked: side, correct: kind === "real" };
  render();
}

function nextQuestion(){
  if(state.qIndex + 1 < state.order.length){ state.qIndex += 1; render(); }
  else finishQuiz();
}

function finishQuiz(){
  const qTotal = state.order.length;
  const score = state.answers.filter(a=>a.correct).length;
  state.view = "result";
  render();
  submitScore(state.name, score, qTotal);
}

function submitScore(name, score, total){
  if(!FORM_ACTION_URL || !ENTRY_NAME) return; // 未設定なら送信しない
  const body = new URLSearchParams();
  body.append(ENTRY_NAME, name);
  body.append(ENTRY_SCORE, String(score));
  body.append(ENTRY_TOTAL, String(total));
  fetch(FORM_ACTION_URL, { method: "POST", mode: "no-cors", body })
    .catch(()=>{ /* no-corsなので失敗検知はできないが送信自体は試みる */ });
}

function loadLeaderboard(){
  state.leaderboardLoading = true; render();
  fetch(SHEET_CSV_URL)
    .then(r => r.text())
    .then(csv => {
      const lines = csv.trim().split("\n").slice(1); // 先頭行(ヘッダー)を除く
      const entries = lines.map(line => {
        const cols = line.split(",").map(c => c.replace(/^"|"$/g,"").trim());
        // 列想定: [タイムスタンプ, 名前, スコア, 合計]
        return { name: cols[1], score: Number(cols[2]), total: Number(cols[3]) };
      }).filter(e => e.name && !isNaN(e.score) && e.total);
      entries.sort((a,b) => (b.score/b.total) - (a.score/a.total));
      state.leaderboard = entries;
    })
    .catch(() => { state.leaderboard = []; })
    .finally(() => { state.leaderboardLoading = false; render(); });
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
}

render();
</script>
</body>
</html>
